[package]
name = "scanny-desktop"
version = "1.0.0"
description = "SCANNY Windows optimization utility"
authors = ["SCANNY contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
sysinfo = { version = "0.40.1", features = ["system", "component", "disk", "gpu"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
